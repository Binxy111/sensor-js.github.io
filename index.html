
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AR Glasses OS Concept</title>
    <style>
        body {
            margin: 0;
            overflow: hidden; /* Prevent scrolling */
            background-color: transparent; /* For potential transparency if the rendering environment supports it */
            color: #eee; /* Light text for contrast */
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        .overlay {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 300px;
            padding: 15px;
            background-color: rgba(0, 0, 0, 0.7); /* Semi-transparent background */
            border-radius: 10px;
        }

        .notification {
            margin-bottom: 10px;
            padding: 10px;
            background-color: rgba(60, 60, 60, 0.8);
            border-radius: 5px;
        }

        .app-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(80px, 1fr));
            gap: 10px;
            padding: 20px;
        }

        .app-icon {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-color: rgba(80, 80, 80, 0.9);
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            font-size: 0.8em;
        }

        .app-icon img {
            width: 40px;
            height: 40px;
            margin-bottom: 5px;
        }

        .status-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            color: #fff;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9em;
        }

        /* More styles can be added to simulate different UI elements */
    </style>
</head>
<body>

    <div class="status-bar">
        <span>WiFi: <span id="wifi-status">Connected</span></span>
        <span>Battery: <span id="battery-level">95%</span></span>
    </div>

    <div class="overlay">
        <div class="notification">New message from John</div>
        <div class="notification">Reminder: Meeting at 3 PM</div>
    </div>

    <div class="app-grid">
        <div class="app-icon">
            <img src="placeholder_app.png" alt="Messages">
            <span>Messages</span>
        </div>
        <div class="app-icon">
            <img src="placeholder_app.png" alt="Calendar">
            <span>Calendar</span>
        </div>
        <div class="app-icon">
            <img src="placeholder_app.png" alt="Navigation">
            <span>Navigation</span>
        </div>
        <div class="app-icon">
            <img src="placeholder_app.png" alt="Camera">
            <span>Camera</span>
        </div>
        </div>

    <script>
        // Basic JavaScript to update status (would need more for real functionality)
        document.getElementById('wifi-status').textContent = 'Connecting...';
        // Simulate battery level change after a delay
        setTimeout(() => {
            document.getElementById('battery-level').textContent = '88%';
        }, 3000);
    </script>

</body>
                         </html>
